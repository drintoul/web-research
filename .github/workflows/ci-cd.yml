name: Python Docker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: VALIDATE (Runs on GitHub's Cloud)
  # ==========================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-python-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # If your tests fail, the workflow stops right here
      - name: Run Tests inside Docker
        run: |
          docker run --rm my-python-app:latest pytest

  # ==========================================
  # JOB 2: DEPLOY (Runs on Your Local PC)
  # ==========================================
  deploy:
    # 1. Wait for the validation job to finish successfully
    needs: validate 
    
    # 2. Only deploy if we are on the main branch (we don't want to deploy pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    # 3. Target your self-hosted runner
    runs-on: [self-hosted, local-dev]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Because it's running locally, we can use a standard local build
      - name: Build Production Docker Image
        run: docker build -t my-python-app:latest .

      - name: Clean up old container
        run: |
          docker stop my-running-app || true
          docker rm my-running-app || true

      - name: Run Docker Container on Localhost
        run: docker run -d --name my-running-app -p 8000:8000 my-python-app:latest
